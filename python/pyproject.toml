[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-zero"
version = "0.1.1"
description = "Decision SDK with experimental planning and world-model simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gen-Zero Authors", email = "core@gen-zero.ai" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.24.0",
    "zstandard>=0.22.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
all = [
    "ortools>=9.8.0",
    "transformers>=4.35.0",
    "huggingface_hub>=0.19.0",
]
vision = [
    "torch",
    "torchvision",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Core neural-dynamics tests exercise the training script metrics.
    "scikit-learn>=1.2.0",
    "ruff>=0.1.0",
]

[project.scripts]
gen-zero = "gen_zero.cli:main"
gen-zero-py = "gen_zero.cli:main"

[tool.setuptools]
# LICENSE and NOTICE are copies of the repo-root files: an sdist cannot reach outside python/.
license-files = ["LICENSE", "NOTICE"]
packages = { find = { where = ["."], include = ["gen_zero*"] } }

[tool.setuptools.package-data]
# Demonstrations and calibration data of the semantic risk classifier.
"gen_zero.service" = ["risk_data/*.jsonl", "risk_data/*.json", "risk_data/*.md"]
