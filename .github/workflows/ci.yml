name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check code formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Stable satisfies the workspace Rust >=1.88 requirement; this is not an MSRV test.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Run cargo test
        run: cargo test --workspace --verbose

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Configure Git for Windows (allow reserved names)
        run: git config --global core.protectNTFS false
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            crates
            python

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
        shell: bash

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check workspace
        run: cargo check --workspace --all-targets
        shell: bash

      - name: Build gen-zero-cli
        run: cargo build -p gen-zero-cli
        shell: bash

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      # Cargo.lock is not shipped; resolve against workspace rust-version first.
      - name: Resolve dependencies for MSRV
        run: cargo +1.88.0 generate-lockfile

      - name: Check workspace on MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

      - name: Test workspace on MSRV
        run: cargo +1.88.0 test --workspace --all-features --locked

  python:
    name: Python core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      # These are CPU tests; bound BLAS threads on shared runners.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "./python[dev]" pyyaml ortools transformers
          python -m pip check

      - name: Run all Python regression tests
        run: python -m pytest -ra --strict-config --strict-markers python/gen_zero/tests python/tests/test_rnn_set_adapter_contract.py

      - name: Audit production entry reachability
        run: |
          python scripts/reachability_audit.py
          # git diff --exit-code only compares tracked content; an untracked or
          # newly-added report file would pass silently. git status --porcelain
          # also flags "??" (untracked) and staged/unstaged changes alike.
          STATUS="$(git status --porcelain -- benchmarks/results/reachability.json)"
          if [ -n "$STATUS" ]; then
            echo "::error::benchmarks/results/reachability.json is stale or untracked; run scripts/reachability_audit.py and commit the result." >&2
            git status --porcelain -- benchmarks/results/reachability.json
            git diff -- benchmarks/results/reachability.json
            exit 1
          fi
