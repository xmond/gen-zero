name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUSTFLAGS: "-D warnings"
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  test:
    name: Python regression gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.0.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "./python[dev]" pyyaml ortools transformers
          python -m pip check

      - name: Run all Python regression tests
        run: python -m pytest -ra --strict-config --strict-markers python/gen_zero/tests python/tests/test_rnn_set_adapter_contract.py

      - name: Audit production entry reachability
        run: |
          python scripts/reachability_audit.py
          STATUS="$(git status --porcelain -- benchmarks/results/reachability.json)"
          if [ -n "$STATUS" ]; then
            echo "::error::benchmarks/results/reachability.json is stale or untracked; run scripts/reachability_audit.py and commit the result." >&2
            git status --porcelain -- benchmarks/results/reachability.json
            git diff -- benchmarks/results/reachability.json
            exit 1
          fi

  rust-gate:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check workspace
        run: cargo check --workspace

      - name: Run cargo tests
        run: cargo test --workspace --verbose

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Resolve dependencies for MSRV
        run: cargo +1.88.0 generate-lockfile

      - name: Check workspace on MSRV
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

      - name: Test workspace on MSRV
        run: cargo +1.88.0 test --workspace --all-features --locked

  build-binary:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test, rust-gate]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: gen-zero
            archive_ext: tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: gen-zero
            archive_ext: tar.gz
            use_cross: true

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: gen-zero
            archive_ext: tar.gz
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: gen-zero
            archive_ext: tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: gen-zero.exe
            archive_ext: zip
            use_cross: false

    steps:
      - name: Configure Git for Windows (allow reserved names)
        if: runner.os == 'Windows'
        run: git config --global core.protectNTFS false
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            crates
            python

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target ${{ matrix.target }}

      - name: Resolve dependencies for MSRV
        run: cargo +1.88.0 generate-lockfile

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo +1.88.0 install cross --version 0.2.5 --locked

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross +1.88.0 build --locked --release --target ${{ matrix.target }} -p gen-zero-cli
          else
            cargo +1.88.0 build --locked --release --target ${{ matrix.target }} -p gen-zero-cli
          fi
        shell: bash

      - name: Package release artifact
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.1}"
          PKG_NAME="gen-zero-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"

          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} "dist/${PKG_NAME}/"
          cp LICENSE NOTICE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"

          cd dist
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            if command -v sha256sum &> /dev/null; then
              sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            fi
          else
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            if command -v sha256sum &> /dev/null; then
              sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
            elif command -v shasum &> /dev/null; then
              shasum -a 256 "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
            else
              powershell -Command "Get-FileHash -Algorithm SHA256 -Path ${PKG_NAME}.zip | ForEach-Object { \$_.Hash.ToLower() + '  ' + (Split-Path -Leaf \$_.Path) } | Out-File -Encoding ASCII ${PKG_NAME}.zip.sha256"
            fi
          fi

      - name: Upload artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, rust-gate]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
